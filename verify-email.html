<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify email — Pounce</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230E0E0D'/%3E%3Cpath d='M6 17.5C7.4 12.2 10.4 9.5 14.5 9' fill='none' stroke='%23F7F7F5' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='17.3' cy='7.3' r='2' fill='%23F7F7F5'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="auth">
        <aside class="auth-brand">
            <a href="/" class="brand brand--inverse">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M6 17.5C7.4 12.2 10.4 9.5 14.5 9" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="17.3" cy="7.3" r="2"/></svg>
                <span>Pounce</span>
            </a>
            <div class="auth-brand-copy">
                <p class="auth-brand-title">Almost <em>there</em>.</p>
                <p class="auth-brand-sub">One click on the link and your account is ready.</p>
            </div>
            <span class="mono auth-brand-foot">© 2026 Pounce</span>
        </aside>

        <main class="auth-main">
            <a href="/" class="brand auth-mobile-brand">
                <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M6 17.5C7.4 12.2 10.4 9.5 14.5 9" fill="none" stroke-width="2" stroke-linecap="round"/><circle cx="17.3" cy="7.3" r="2"/></svg>
                <span>Pounce</span>
            </a>
            <div class="auth-form">
                <div id="loading-state" class="stack">
                    <h1 class="auth-title">Verifying your email</h1>
                    <div class="status-line is-active"><span class="dot"></span><span>Checking your link…</span></div>
                </div>

                <div id="error-state" class="stack" hidden>
                    <h1 class="auth-title">That link didn't work</h1>
                    <p id="error-message" class="notice notice-error">There was a problem verifying your email address.</p>
                    <a href="/login" class="btn btn-primary btn-block">Go to sign in</a>
                </div>
            </div>
        </main>
    </div>

    <script>
        function showError(message) {
            document.getElementById('loading-state').hidden = true;
            document.getElementById('error-state').hidden = false;
            document.getElementById('error-message').textContent = message;
        }

        (async function verify() {
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) {
                showError('This link is missing its verification code. Open the link from your email again.');
                return;
            }

            try {
                const response = await fetch(`/api/verify-email?token=${encodeURIComponent(token)}`);
                if (response.ok) {
                    window.location.href = '/login?verified=true';
                } else {
                    const data = await response.json();
                    showError(data.error || 'Verification failed. Please try again or contact support.');
                }
            } catch (error) {
                console.error('Verification error:', error);
                showError('Something went wrong while verifying. Please try again later.');
            }
        })();
    </script>
</body>
</html>
