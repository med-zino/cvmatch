<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saved jobs — CVMatch</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230E0E0D'/%3E%3Cpath d='M7 8h7M7 12h4M12.5 15.5l2 2 3.5-4' fill='none' stroke='%23F7F7F5' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <header class="app-nav">
        <a href="/app" class="brand">
            <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="currentColor"/><path d="M7 8h7M7 12h4M12.5 15.5l2 2 3.5-4" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>CVMatch</span>
        </a>
        <nav class="nav-tabs" aria-label="Main">
            <a class="nav-tab" href="/app">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <span>Find matches</span>
            </a>
            <a class="nav-tab" href="/feed">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="1.5"/><rect x="4" y="14" width="16" height="6" rx="1.5"/></svg>
                <span>Feed</span>
            </a>
            <a class="nav-tab" href="/saved-jobs" aria-current="page">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
                <span>Saved jobs</span>
                <span class="nav-count" data-saved-count hidden></span>
            </a>
        </nav>
        <div class="nav-user">
            <span class="nav-email" data-user-email></span>
            <button type="button" class="nav-signout" data-signout>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
                <span>Sign out</span>
            </button>
        </div>
    </header>

    <main class="container">
        <div class="page-head">
            <div>
                <h1 class="page-title">Saved jobs</h1>
                <p class="page-sub" id="savedSubtitle">Loading your shortlist…</p>
            </div>
            <a class="btn btn-secondary" href="/app">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
                <span>Back to matching</span>
            </a>
        </div>

        <div class="saved-tools" id="savedTools" hidden>
            <div class="status-tabs" id="statusTabs" role="tablist" aria-label="Filter by status"></div>
            <div class="tools">
                <label class="search">
                    <span class="visually-hidden">Search saved jobs</span>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input class="input input-sm" id="searchJobs" type="search" placeholder="Search title or company">
                </label>
                <select class="select select-sm" id="sortBy" aria-label="Sort saved jobs">
                    <option value="newest">Newest first</option>
                    <option value="score">Best match</option>
                    <option value="company">Company A–Z</option>
                </select>
            </div>
        </div>

        <div class="saved-list" id="savedList">
            <div class="empty empty--compact"><p class="empty-text">Loading…</p></div>
        </div>
    </main>

    <script src="/js/title-suggest.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/saved.js"></script>
</body>
</html>
